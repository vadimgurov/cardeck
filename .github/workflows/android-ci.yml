# При каждом нажатии автоматически создается **официально подписанный** Release APK (размещаются только артефакты, а выпуск GitHub не выпускается).
#
# Номер версии накапливается автоматически: `appVersionName` + этот run_number
#   Пример: 0.1.13 → APK 0.1.13.42 (код версии = 1_130_042), +1 за каждое нажатие, которое можно напрямую перезаписать и установить.
#   В базовой версии по-прежнему необходимо изменить только имя appVersionName файла app/build.gradle.kts.
#
# Требуемые секреты (Настройки → Секреты и переменные → Действия):
#   KEYSTORE_BASE64 base64 хранилища ключей (одна строка без разрывов строк)
#                      Linux/macOS: base64 -w0 keystore.jks
#                      Windows: [Convert]::ToBase64String([IO.File]::ReadAllBytes("keystore.jks"))
#   KEYSTORE_PASSWORDПароль магазина
#   KEY_ALIAS ключевой псевдоним
#   KEY_PASSWORD ключевой пароль
# Необязательно:
#   EXPECTED_CERT_SHA256 Ожидаемый сертификат подписи SHA-256 (с двоеточием или без него) — в случае совпадения он будет сравниваться дословно.
#                         Предотвратите неправильное использование других хранилищ ключей, чтобы проверить «официальную версию».
#
# ** без KEYSTORE_BASE64 завершится ошибкой** и никогда не вернет подпись отладки:
# Пакеты, подписанные с помощью отладочного сертификата, все пользователи должны удалить и переустановить при переходе на официальный сертификат в будущем (AGENTS.md «Подпись — необратимое решение»).
# На стороне Gradle есть второй шлюз: если передан -Pcardeck.buildNumber, но нет keystore.properties, сборка завершится неудачей.
name: Build Release APK

on:
  push:
    branches: ['**'] # Пуш любой ветки будет упакован；tag Не сработало（Нет необходимости отправлять Release）
  workflow_dispatch:

permissions:
  contents: read # код только для чтения，Не отправлено Release、Не пишите склад

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Создайте официальную подпись APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Проверить код
        uses: actions/checkout@v4

      # AGP 8.7 требует JDK 17 и соответствует jvmTarget в app/build.gradle.kts.
      - name: Установка JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Конфигурация Gradle
        uses: gradle/actions/setup-gradle@v4

      # build.gradle.kts анализируется с помощью rootProject.file(storeFile), поэтому .jks аналогичен
      # keystore.properties размещаются в корне хранилища (оба были gitignore и не будут отправлены)
      - name: Написать конфигурацию подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          # Каждая из четырех ценностей незаменима; если он отсутствует, произойдет непосредственный сбой (подпись отладки никогда не будет возвращена)
          MISSING=""
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v:-}" ]; then MISSING="$MISSING $v"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Отсутствует склад Secrets:$MISSING。Прибытие ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/settings/secrets/actions добавить（KEYSTORE_BASE64 генерировать：PowerShell [Convert]::ToBase64String([IO.File]::ReadAllBytes('keystore.jks'))）。Эта сборочная линия производит только официальные пакеты для подписи.，Не будет возвращен debug подпись。"
            exit 1
          fi
          # Разрешить вставку нескольких строк base64 (обычно в копии Windows), удалите новые строки перед декодированием.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "Подписные материалы готовы.（release.jks + keystore.properties）"

      - name: Рассчитать номер версии
        id: version
        run: |
          set -eu
          BASE=$(sed -n 's/^val appVersionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          test -n "$BASE" || { echo "::error::Невозможно получить доступ из app/build.gradle.kts читать appVersionName"; exit 1; }
          VERSION="${BASE}.${GITHUB_RUN_NUMBER}"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Эта версия：$VERSION（versionCode = base*10000 + ${GITHUB_RUN_NUMBER}）"

      # Номер версии рассчитывается build.gradle.kts по тем же правилам (см. buildNumber в файле), здесь передается только run_number
      - name: строить Release APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew :app:assembleRelease "-Pcardeck.buildNumber=$BUILD_NUMBER" --stacktrace

      - name: Проверьте подпись и пакет
        id: package
        env:
          VERSION: ${{ steps.version.outputs.name }}
          EXPECTED_CERT: ${{ secrets.EXPECTED_CERT_SHA256 }}
        run: |
          set -eu
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::не найден $APK"; exit 1; }

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n1)
          test -n "$APKSIGNER" || { echo "::error::не найден apksigner"; exit 1; }
          "$APKSIGNER" verify --print-certs "$APK" | tee certs.txt

          # Хранилище ключей настроено, но сертификат отладки = keystore.properties не был прочитан и не должен быть выпущен.
          if grep -q "CN=Android Debug" certs.txt; then
            echo "::error::Продукт debug подпись——Официальная конфигурация подписи не вступает в силу（Проверить keystore.properties с storeFile путь）"
            exit 1
          fi
          CERT=$(grep "certificate SHA-256 digest" certs.txt | head -n1 | sed 's/.*digest: //')
          test -n "$CERT" || { echo "::error::Невозможно прочитать отпечаток сертификата подписи"; exit 1; }

          if [ -n "${EXPECTED_CERT:-}" ]; then
            EXPECTED=$(printf '%s' "$EXPECTED_CERT" | tr -d ': ' | tr 'A-F' 'a-f')
            ACTUAL=$(printf '%s' "$CERT" | tr -d ': ' | tr 'A-F' 'a-f')
            if [ "$EXPECTED" != "$ACTUAL" ]; then
              echo "::error::Подписание сертификата с EXPECTED_CERT_SHA256 непоследовательный：Ожидание $EXPECTED，фактический $ACTUAL"
              exit 1
            fi
            echo "Подписание сертификата с EXPECTED_CERT_SHA256 последовательный"
          fi

          NAME="CarDeck-${VERSION}-release.apk"
          cp "$APK" "$NAME"
          SHA=$(sha256sum "$NAME" | cut -d' ' -f1)
          SIZE=$(du -h "$NAME" | cut -f1)
          {
            echo "name=$NAME"
            echo "sha=$SHA"
            echo "cert=$CERT"
            echo "size=$SIZE"
          } >> "$GITHUB_OUTPUT"
          echo "Сгенерировано $NAME（$SIZE）"

      - name: загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.name }}
          if-no-files-found: error
          retention-days: 30
          overwrite: 'true' # Повторить то же самое run Номер версии остается неизменным，Перезаписать старые артефакты вместо сбоя

      - name: Написать отчет о пробеге
        env:
          VERSION: ${{ steps.version.outputs.name }}
          NAME: ${{ steps.package.outputs.name }}
          SHA: ${{ steps.package.outputs.sha }}
          CERT: ${{ steps.package.outputs.cert }}
          SIZE: ${{ steps.package.outputs.size }}
        run: |
          set -eu
          {
            echo "### CarDeck ${VERSION}（Официальная подпись）"
            echo
            echo "| предмет | ценность |"
            echo "|---|---|"
            echo "| APK | ${NAME} |"
            echo "| APK размер | ${SIZE} |"
            echo "| SHA-256 | ${SHA} |"
            echo "| Сертификат подписи SHA-256 | ${CERT} |"
            echo
            echo "Установка：adb install -r ${NAME}"
            echo
            echo "> Artifacts Объем, показанный в списке,**Сжатый пакет**размер（dex в APK Никакого сжатия внутри，При повторной упаковке он уменьшится прибл. 45%）；"
            echo "> После декомпрессии APK См. таблицу выше для определения объема.。"
          } >> "$GITHUB_STEP_SUMMARY"

      # Поместите его после выпуска пакета: одиночный тест не пройден, и этот запуск отмечен красным, но APK все равно можно загрузить.
      - name: Модульное тестирование
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Загрузить отчет о тестировании（Легко обнаружить в случае неисправности）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
